 if(o=='sl'){const n=v('lnm').trim(),em=v('lem').trim();if(!n)return toast('Enter a name');if(em&&!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email');const nw=!id,z=nw?{id:crypto.randomUUID(),created:td(),acts:[]}:l,old=z.st;Object.assign(z,{n,co:v('lco').trim(),em:em.toLowerCase(),ph:v('lph').trim(),val:+v('lvl')||0,src:v('lsr'),st:+v('lst'),fu:v('lfu'),nt:v('lnt').trim()});if(v('lcl')!=='')z.ex=1;if(nw){S.crm.push(z);addA(z,'stage','Lead created in '+ST[z.st][0])}else if(old!=z.st)addA(z,'stage','Stage: '+ST[old][0]+' \u2192 '+ST[z.st][0]);await crmPut(z);toast('Lead saved');return go(nw?'crm':'lead/'+z.id)}
 if(!l)return;
 if(o=='mv'){const o0=l.st;l.st=Math.max(0,Math.min(4,l.st+(+x)));addA(l,'stage','Stage: '+ST[o0][0]+' \u2192 '+sg(l)[0]);return done()}
 if(o=='st'){if(l.st==+x)return;const o0=l.st;l.st=+x;addA(l,'stage','Stage: '+ST[o0][0]+' \u2192 '+sg(l)[0]);return done('Moved to '+sg(l)[0])}
 if(o=='log'){const tx=v('lax').trim();if(!tx)return toast('Write a short note first');addA(l,v('lat'),tx);return done('Activity logged')}
 if(o=='fdn'){l.fu='';addA(l,'stage','Follow-up completed');return done('Follow-up done')}
 if(o=='sn'){l.fu=addDays(l.fu>td()?l.fu:td(),3);return done('Snoozed 3 days')}
 if(o=='conv')return crmConv(l)},true);
let dgl=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-lid]');if(c){dgl=c.dataset.lid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dgl)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c&&dgl){e.preventDefault();document.querySelectorAll('.kc').forEach(k=>k.classList.toggle('dr',k===c))}});
document.addEventListener('drop',async e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(!c||!dgl)return;e.preventDefault();const l=lg(dgl),n=+c.dataset.col;dgl=null;if(l&&l.st!=n){const o0=l.st;l.st=n;addA(l,'stage','Stage: '+ST[o0][0]+' \u2192 '+ST[n][0]);crmLocal();toast('Moved to '+ST[n][0]);render();await crmPut(l);return}render()});
document.addEventListener('dragend',()=>{dgl=null;document.querySelectorAll('.kc.dr').forEach(k=>k.classList.remove('dr'))});
document.addEventListener('change',e=>{if(e.target.id!='lcl')return;const c=cls()[+e.target.value];if(e.target.value===''||!c)return;const set=(i,x)=>{const n=$('#'+i);if(n)n.value=x};set('lnm',c.name);set('lco',c.name);set('lem',[...c.em][0]||'');set('lsr','Existing client')});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='lax'){const b=document.querySelector('[data-crm^="log:"]');b&&b.click()}});

document.addEventListener('input',e=>{if(e.target.id!='cq')return;const p=e.target.selectionStart;S.cq=e.target.value;render();const n=$('#cq');if(n){n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id!='ctp')return;S.ctp=e.target.value;render()});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-crm]');if(!t)return;const[o,id,x]=t.dataset.crm.split(':'),l=lg(id);
 if(o=='exp'){const c=s=>{s=String(s==null?'':s);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'},R=[['Name','Company','Email','Phone','Stage','Value','Source','Temperature','Follow-up','Notes'],...FL().map(l=>[l.n,l.co,l.em,l.ph,sg(l)[0],l.val,l.src,l.tp==null||l.tp===''?'':TP[l.tp][0],l.fu,l.nt])],b=new Blob(['\ufeff'+R.map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='crm-leads-'+td()+'.csv';a.click();return toast('Exported '+(R.length-1)+' leads')}
 if(!l||(o!='tp'&&o!='fu'))return;
 if(o=='tp')l.tp=l.tp===+x?null:+x;else{l.fu=+x?addDays(td(),+x):'';addA(l,'stage',+x?'Follow-up set for '+fd(l.fu):'Follow-up cleared')}
 const kx=$('#lax')?$('#lax').value:'',kt=$('#lat')?$('#lat').value:'';crmLocal();render();const a=$('#lax'),b=$('#lat');if(a&&kx)a.value=kx;if(b&&kt)b.value=kt;await crmPut(l)},true);

document.addEventListener('click',e=>{const t=e.target.closest('[data-crm]');if(!t)return;const[o,id]=t.dataset.crm.split(':');if(o=='add'){S.nls=+id;go('newlead')}if(o=='tl'){S.clost=!S.clost;render()}},true);
document.addEventListener('change',e=>{if(e.target.id=='csr'){S.csort=e.target.value;render()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-lid]');if(c)setTimeout(()=>c.classList.add('gh'),0)});
document.addEventListener('dragend',()=>document.querySelectorAll('.lc.gh').forEach(c=>c.classList.remove('gh')));

boot();
</script></body></html>
